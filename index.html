<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>LORD AZIZ REPORT v12.0 🔥</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="stars"></canvas>
<div id="loadingOverlay" class="loading-overlay">
    <div class="loading-spinner"></div>
</div>

<div id="menuOverlay" class="menu-overlay"></div>

<div id="sideMenu" class="side-menu">
    <div class="menu-header">
        <h3>⚡ LORD AZIZ ⚡</h3>
    </div>
    <div class="menu-buttons">
        <button class="menu-btn whatsapp" id="menuWhatsappBtn">💬 WHATSAPP CHANNEL</button>
        <button class="menu-btn telegram" id="menuTelegramBtn">✈️ TELEGRAM CHANNEL</button>
        <button class="menu-btn owner" id="menuOwnerBtn">👑 DM OWNER</button>
    </div>
    <div class="menu-footer">
        <div class="uid-section">
            <div class="uid-label">🌐YOUR UID</div>
            <div class="uid-value" id="userUid">Chargement...</div>
            <button class="copy-uid-btn" id="copyUidBtn">📋 COPIER L'UID</button>
        </div>
        <div class="close-menu-btn" id="closeMenuBtn">✖ FERMER</div>
    </div>
</div>

<div class="menu-float" id="menuIcon">☰</div>

<div class="video-wrapper">
    <video autoplay loop muted playsinline>
        <source src="https://files.catbox.moe/d51tit.mp4" type="video/mp4">
    </video>
</div>

<h1>LORD AZIZ REPORT🪬</h1>
<p class="subtitle">SUBMIT REPORT<br>INCIDENT DETAILS</p>

<div class="report-box">
    <div class="phone-input" id="phoneWrapper">
        <span>☎️</span>
        <input type="tel" id="phone" placeholder="Enter phone number">
    </div>
    <div class="motifs">
        <button data-type="ABUSE" class="motif-btn">ABUSE 🛡️</button>
        <button data-type="SCAM" class="motif-btn">SCAM ⚠️</button>
        <button data-type="SPAM" class="motif-btn">SPAM ❌️</button>
    </div>
    <button id="sendBtn" class="envoyer-btn">ENVOYER 🔰</button>
</div>

<script src="script.js"></script>
</body>
</html>
